[pytest]
# Pytest configuration for games_as_evals

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    slow: marks tests as slow (integration tests with Modal)
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    expensive: marks tests as expensive (require Modal deployment, skipped by default)

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Test paths
testpaths = src/tests
